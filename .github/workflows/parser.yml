name: PostgreSQL parser

on:
  push:
  pull_request:

jobs:
  parser:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
        if: runner.os == 'Linux'
      - run: dart pub get
      - run: dart analyze
      - run: dart run tool/ffigen.dart --check
        working-directory: packages/postgresql_parser
      - run: dart test
        working-directory: packages/postgresql_parser
      - run: dart test --concurrency=1 --timeout=3m
        working-directory: packages/serverpod_sql_check

  database-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: disposable_ci_fixture
          POSTGRES_DB: sql_check_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sql_check_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQL_CHECK_TEST_DATABASE_URL: postgresql://postgres:disposable_ci_fixture@localhost:5432/sql_check_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.4
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: dart pub get
      - run: dart test test/database_check_test.dart test/database_integration_test.dart --concurrency=1 --timeout=3m
        working-directory: packages/serverpod_sql_check
